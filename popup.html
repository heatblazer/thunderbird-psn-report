<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 520px; font-family: sans-serif; font-size: 13px; margin: 10px; }
    label { display: inline-block; margin-right: 10px; }
    button { margin: 6px 6px 6px 0; padding: 4px 10px; }
    pre { white-space: pre-wrap; max-height: 360px; overflow: auto;
          background: #8881; padding: 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <label>Years back:
    <input id="years" type="number" min="1" max="20" value="12" style="width:50px">
  </label>
  <button id="run">Scan</button>
  <button id="copy" disabled>Copy CSV</button>
  <pre id="out">Press Scan to start.</pre>
  <script src="popup.js"></script>
</body>
</html>
